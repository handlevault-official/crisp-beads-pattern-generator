<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beads Pattern Studio - Sailor Moon Edition</title>
    <style>
        :root {
            --arcade-bg: #0d050a;
            --arcade-panel: #1a0d14;
            --arcade-border: #ff007f;
            --arcade-pink: #ff3399;
            --arcade-yellow: #ffee00;
            --text-color: #ff3399;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--arcade-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: var(--arcade-panel);
            border: 3px solid var(--arcade-border);
            padding: 25px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.2);
            border-radius: 4px;
        }
        h1 {
            text-align: center;
            color: var(--arcade-yellow);
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px var(--arcade-border);
            letter-spacing: 2px;
        }
        .grid-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            .grid-controls { grid-template-columns: 1fr; }
        }
        .tool-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--arcade-yellow);
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        input[type="file"], select, button {
            width: 100%;
            padding: 12px;
            background: #000;
            color: var(--text-color);
            border: 2px solid var(--arcade-border);
            border-radius: 0px;
            font-family: inherit;
            font-weight: bold;
            box-sizing: border-box;
            outline: none;
        }
        input[type="file"] {
            cursor: pointer;
            font-size: 0.75rem;
        }
        select option {
            background: #0d050a;
            color: var(--text-color);
        }
        button {
            background-color: var(--arcade-yellow);
            color: #000;
            cursor: pointer;
            margin-top: 10px;
            border-color: var(--arcade-yellow);
            box-shadow: 0 0 10px rgba(255, 238, 0, 0.5);
            transition: all 0.1s;
            text-transform: uppercase;
        }
        button:hover {
            background-color: var(--arcade-border);
            border-color: var(--arcade-border);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.7);
        }
        .preview-container {
            margin-top: 20px;
            text-align: center;
            border: 2px dashed var(--arcade-border);
            padding: 15px;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050204;
        }
        canvas {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
        }
        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            line-height: 1.8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .footer a {
            color: var(--arcade-yellow);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer .kofi-link {
            color: var(--arcade-border);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ MOONLIGHT BEADS PATTERN STUDIO ]</h1>
        
        <div class="tool-group">
            <label for="imageUpload">> 1. Upload or Drag Design Image</label>
            <input type="file" id="imageUpload" accept="image/*" onchange="handleImage(event)">
        </div>

        <div class="grid-controls">
            <div class="tool-group">
                <label for="gridSizeSelect">> 2. Bead Grid Size</label>
                <select id="gridSizeSelect" onchange="reprocessImage()">
                    <option value="12">12x12 (Mini Pegboard)</option>
                    <option value="24" selected>24x24 (Standard Pegboard)</option>
                    <option value="32">32x32 (Large Pegboard)</option>
                    <option value="48">48x48 (Master Mosaic)</option>
                </select>
            </div>
            <div class="tool-group">
                <label for="paletteSelect">> 3. Perler Bead Palette</label>
                <select id="paletteSelect" onchange="reprocessImage()">
                    <option value="full" selected>Full Color Palette</option>
                    <option value="pastel">Sailor Moon Pastel Tones</option>
                    <option value="neon">Cyber Arcade Neon</option>
                </select>
            </div>
        </div>

        <div class="preview-container">
            <canvas id="beadCanvas">UPLOAD IMAGE TO GENERATE BEAD PATTERN...</canvas>
        </div>

        <button id="downloadBtn" style="display:none;" onclick="downloadImage()">>> Download Bead Pattern Grid <<</button>
        
        <div class="footer">
            HandleVault Digital • Crisp Suite Utility<br>
            <a href="https://ko-fi.com//Handlevaultofficial" target="_blank" class="kofi-link">☕ Support on Ko-fi</a>
        </div>
    </div>

    <script>
        let uploadedImage = null;

        function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    processBeadPattern();
                }
                img.onerror = function() {
                    alert('Error loading image file.');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function reprocessImage() {
            if (uploadedImage) {
                processBeadPattern();
            }
        }

        function processBeadPattern() {
            if (!uploadedImage) return;

            const canvas = document.getElementById('beadCanvas');
            const ctx = canvas.getContext('2d');
            
            const gridSize = parseInt(document.getElementById('gridSizeSelect').value);
            const paletteMode = document.getElementById('paletteSelect').value;

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = gridSize;
            tempCanvas.height = gridSize;

            tempCtx.imageSmoothingEnabled = false;
            tempCtx.drawImage(uploadedImage, 0, 0, gridSize, gridSize);

            try {
                const imgData = tempCtx.getImageData(0, 0, gridSize, gridSize);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    if (paletteMode === 'pastel') {
                        data[i] = Math.min(255, data[i] + 30);     
                        data[i+1] = Math.max(0, data[i+1] - 10);  
                        data[i+2] = Math.min(255, data[i+2] + 40); 
                    } else if (paletteMode === 'neon') {
                        data[i] = data[i] > 127 ? 255 : 0;
                        data[i+1] = data[i+1] > 127 ? 255 : 0;
                        data[i+2] = data[i+2] > 127 ? 255 : 0;
                    }
                }
                tempCtx.putImageData(imgData, 0, 0);
            } catch (err) {
                console.warn("Palette filter skipped.", err);
            }

            const displaySize = 400; 
            canvas.width = displaySize;
            canvas.height = displaySize;
            ctx.imageSmoothingEnabled = false;
            
            ctx.drawImage(tempCanvas, 0, 0, gridSize, gridSize, 0, 0, displaySize, displaySize);

            document.getElementById('downloadBtn').style.display = 'block';
        }

        function downloadImage() {
            const canvas = document.getElementById('beadCanvas');
            try {
                const link = document.createElement('a');
                link.download = 'sailor-moon-bead-pattern.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('Download failed due to browser security restrictions.');
            }
        }
    </script>

</body>
        </html>
