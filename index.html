<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisp Beads Pattern Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Press Start 2P', cursive;
        }

        header h1 {
            color: #ff477e;
            font-size: 20px;
            margin-bottom: 8px;
            text-shadow: 2px 2px #4895ef;
        }

        header p {
            color: #b5e2fa;
            font-size: 10px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .sidebar {
            flex: 1 1 280px;
            background: #242438;
            border: 2px solid #ff477e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .main-canvas {
            flex: 2 1 500px;
            background: #242438;
            border: 2px solid #4895ef;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            color: #ffdd00;
            margin-bottom: 15px;
            border-bottom: 1px dashed #ff477e;
            padding-bottom: 8px;
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .color-swatch {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid #1a1a24;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
        }

        .color-swatch:hover, .color-swatch.selected {
            transform: scale(1.2);
            border-color: #ffffff;
        }

        .btn {
            display: block;
            width: 100%;
            background: #ff477e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #ff1053;
        }

        .btn-blue {
            background: #4895ef;
        }

        .btn-blue:hover {
            background: #3f37c9;
        }

        #gridCanvas {
            background: #111;
            border: 2px solid #ffffff;
            cursor: crosshair;
            margin-top: 10px;
            border-radius: 4px;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            padding: 8px;
            border-radius: 6px;
            border: none;
            background: #1a1a24;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>CRISP BEADS PATTERN GENERATOR</h1>
        <p>Design Perler & Hama Bead Patterns Easily!</p>
    </header>

    <div class="container">
        <!-- Sidebar: Palette & Controls -->
        <div class="sidebar">
            <h2>COLOR PALETTE</h2>
            <div class="palette" id="palette"></div>

            <h2>GRID SIZE</h2>
            <div class="controls">
                <label for="gridSelect">Canvas Size:</label>
                <select id="gridSelect">
                    <option value="16">16 x 16 Pegboard</option>
                    <option value="29" selected>29 x 29 Standard</option>
                    <option value="32">32 x 32 Large</option>
                </select>
            </div>

            <button class="btn" id="clearBtn">Clear Canvas</button>

            <h2>STORE & SUPPORT</h2>
            <a href="https://ko-fi.com/handlevault" target="_blank" class="btn btn-blue">Sponsor on Ko-fi</a>
        </div>

        <!-- Main Studio Area -->
        <div class="main-canvas">
            <h2>BEAD PEGBOARD CANVAS</h2>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Click or drag on the pegboard to place beads!</p>
            <canvas id="gridCanvas" width="464" height="464"></canvas>
            <button class="btn btn-blue" id="downloadBtn" style="margin-top: 15px; max-width: 300px;">Download Pattern PNG</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        const paletteContainer = document.getElementById('palette');
        const gridSelect = document.getElementById('gridSelect');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let gridSize = parseInt(gridSelect.value);
        let cellSize = canvas.width / gridSize;
        let selectedColor = '#ff477e';
        let isDrawing = false;

        // Common Perler Bead Colors
        const beadColors = [
            '#ff477e', '#ff1053', '#ff9f1c', '#ffbf00', '#2ec4b6',
            '#4895ef', '#7209b7', '#4cc9f0', '#ffffff', '#000000',
            '#8d99ae', '#d90429', '#ffb703', '#fb8500', '#06d6a0'
        ];

        // Initialize Palette
        beadColors.forEach((color, index) => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch' + (index === 0 ? ' selected' : '');
            swatch.style.backgroundColor = color;
            swatch.addEventListener('click', () => {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
                selectedColor = color;
            });
            paletteContainer.appendChild(swatch);
        });

        // Grid Array
        let grid = Array(gridSize).fill().map(() => Array(gridSize).fill('#111111'));

        function drawGrid() {
            cellSize = canvas.width / gridSize;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    // Draw Bead (Circle look)
                    ctx.fillStyle = grid[r][c];
                    ctx.beginPath();
                    ctx.arc(c * cellSize + cellSize/2, r * cellSize + cellSize/2, cellSize/2 - 1, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner hole of Perler Bead
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(c * cellSize + cellSize/2, r * cellSize + cellSize/2, cellSize/6, 0, Math.PI * 2);
                    ctx.fill();

                    // Grid line outline
                    ctx.strokeStyle = '#222';
                    ctx.strokeRect(c * cellSize, r * cellSize, cellSize, cellSize);
                }
            }
        }

        function fillBead(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const c = Math.floor(x / cellSize);
            const r = Math.floor(y / cellSize);

            if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
                grid[r][c] = selectedColor;
                drawGrid();
            }
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; fillBead(e); });
        canvas.addEventListener('mousemove', (e) => { if (isDrawing) fillBead(e); });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        gridSelect.addEventListener('change', (e) => {
            gridSize = parseInt(e.target.value);
            grid = Array(gridSize).fill().map(() => Array(gridSize).fill('#111111'));
            drawGrid();
        });

        clearBtn.addEventListener('click', () => {
            grid = Array(gridSize).fill().map(() => Array(gridSize).fill('#111111'));
            drawGrid();
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'crisp-beads-pattern.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        drawGrid();
    </script>
</body>
</html>
